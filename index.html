<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Khawar Hayyat is a senior content writer and QA tester in Multan, Pakistan. Four years of SEO content, case studies, and books, plus manual testing for web and mobile apps."
    />
    <title>Khawar Hayyat | Content That Ranks, Software That Works</title>
    <meta name="theme-color" id="theme-color" content="#17140f" />
    <script>
      (function () {
        var theme = 'dark'
        try {
          theme = localStorage.getItem('theme') || 'dark'
        } catch (e) {}
        if (theme === 'dark') {
          document.documentElement.classList.add('dark')
        }
        document
          .getElementById('theme-color')
          .setAttribute('content', theme === 'dark' ? '#17140f' : '#f7f4ef')
      })()
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
